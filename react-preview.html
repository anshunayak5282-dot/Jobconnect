<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobConnect – React 18 & Tailwind CSS Live Build</title>
  <!-- React 18 & ReactDOM via Unpkg/CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel standalone for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .glass-nav { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_DATA = {
      currentUserRole: 'seeker',
      profile: {
        name: "Ankit Kumar",
        email: "ankit.dev@example.com",
        phone: "+91 98765 43210",
        location: "Ranchi, Jharkhand",
        about: "Full-Stack MERN Developer specializing in React, Node.js, and MongoDB architectures.",
        title: "Full Stack Developer",
        skills: ["React", "Node.js", "Express", "MongoDB", "Tailwind CSS"],
        resumeName: "Ankit_Kumar_FullStack_Resume.pdf"
      },
      jobs: [
        {
          id: "job-1",
          title: "Junior Web Developer",
          company: "ABC Technologies",
          location: "Ranchi",
          salaryMin: 3,
          salaryMax: 5,
          experience: "Fresher",
          jobType: "Full Time",
          skills: ["HTML", "CSS", "JavaScript", "React"],
          deadline: "2026-11-15",
          status: "Approved",
          description: "We are seeking a motivated Junior Web Developer in Ranchi to create interactive web interfaces with React and Tailwind CSS."
        },
        {
          id: "job-2",
          title: "Full Stack MERN Engineer",
          company: "InnovateX Solutions",
          location: "Bengaluru",
          salaryMin: 8,
          salaryMax: 14,
          experience: "1-3 Years",
          jobType: "Full Time",
          skills: ["React", "Node.js", "MongoDB", "Express"],
          deadline: "2026-11-20",
          status: "Approved",
          description: "Build high-scale SaaS products using React state management, Express routes, and MongoDB."
        },
        {
          id: "job-3",
          title: "Frontend React Developer",
          company: "CloudScale India",
          location: "Remote",
          salaryMin: 6,
          salaryMax: 10,
          experience: "Fresher",
          jobType: "Full Time",
          skills: ["React", "Tailwind CSS", "JavaScript"],
          deadline: "2026-11-25",
          status: "Approved",
          description: "Design pixel-perfect interfaces with modern React hooks and Tailwind CSS."
        }
      ],
      applications: [
        {
          id: "app-101",
          jobId: "job-1",
          applicantName: "Ankit Kumar",
          applicantEmail: "ankit.dev@example.com",
          status: "Under Review",
          appliedAt: "2026-10-03"
        }
      ],
      savedJobIds: ["job-2"]
    };

    function App() {
      const [role, setRole] = useState('seeker');
      const [jobs, setJobs] = useState(INITIAL_DATA.jobs);
      const [applications, setApplications] = useState(INITIAL_DATA.applications);
      const [savedJobIds, setSavedJobIds] = useState(INITIAL_DATA.savedJobIds);
      const [activeTab, setActiveTab] = useState('explore');
      const [search, setSearch] = useState('');
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const handleApply = (jobId) => {
        const newApp = {
          id: `app-${Date.now()}`,
          jobId,
          applicantName: INITIAL_DATA.profile.name,
          applicantEmail: INITIAL_DATA.profile.email,
          status: "Applied",
          appliedAt: new Date().toISOString().split('T')[0]
        };
        setApplications([newApp, ...applications]);
        showToast("Application submitted successfully with React!");
      };

      const handleToggleSave = (jobId) => {
        if (savedJobIds.includes(jobId)) {
          setSavedJobIds(savedJobIds.filter(id => id !== jobId));
          showToast("Removed from saved jobs");
        } else {
          setSavedJobIds([...savedJobIds, jobId]);
          showToast("Saved vacancy to bookmarks!");
        }
      };

      const filteredJobs = jobs.filter(j => 
        j.status === "Approved" && 
        (j.title.toLowerCase().includes(search.toLowerCase()) || j.skills.some(s => s.toLowerCase().includes(search.toLowerCase())))
      );

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Role Switcher */}
          <div className="bg-slate-900 text-white px-4 py-2 text-xs flex justify-between items-center sticky top-0 z-50">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
              <span>React 18 Active Role:</span>
              <span className="font-bold px-2 py-0.5 rounded bg-indigo-600 uppercase text-[10px]">{role}</span>
            </div>
            <div className="flex gap-1 bg-slate-800 p-0.5 rounded-lg">
              <button onClick={() => setRole('seeker')} className={`px-2.5 py-1 rounded text-xs ${role === 'seeker' ? 'bg-indigo-600 font-bold' : ''}`}>Candidate</button>
              <button onClick={() => setRole('hr')} className={`px-2.5 py-1 rounded text-xs ${role === 'hr' ? 'bg-purple-600 font-bold' : ''}`}>HR Recruiter</button>
              <button onClick={() => setRole('admin')} className={`px-2.5 py-1 rounded text-xs ${role === 'admin' ? 'bg-rose-600 font-bold' : ''}`}>Super Admin</button>
            </div>
          </div>

          {/* Header */}
          <header className="glass-nav border-b border-slate-200 sticky top-8 z-40 px-6 py-4 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-white flex items-center justify-center font-bold">J</div>
              <div>
                <h1 className="text-xl font-black bg-gradient-to-r from-slate-900 to-indigo-600 bg-clip-text text-transparent">JobConnect</h1>
                <p className="text-[10px] text-indigo-700 font-bold uppercase tracking-wider">React 18 + Tailwind</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button onClick={() => setActiveTab('explore')} className={`px-3 py-1.5 rounded-xl text-xs font-semibold ${activeTab === 'explore' ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-600'}`}>Explore Jobs</button>
              <button onClick={() => setActiveTab('applications')} className={`px-3 py-1.5 rounded-xl text-xs font-semibold ${activeTab === 'applications' ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-600'}`}>My Applications ({applications.length})</button>
              <a href="./login.html" className="ml-2 px-3.5 py-1.5 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white font-bold text-xs transition">Sign In</a>
            </div>
          </header>

          {/* Main Body */}
          <main className="max-w-7xl w-full mx-auto p-6 flex-1">
            {role === 'seeker' && activeTab === 'explore' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-br from-indigo-950 to-slate-900 text-white p-8 rounded-3xl shadow-xl">
                  <h2 className="text-3xl font-extrabold">Find Your Next Tech Role</h2>
                  <p className="text-slate-300 text-xs mt-1">Built with React components and modern Tailwind utility classes.</p>
                  <div className="mt-4 flex gap-2">
                    <input
                      type="text"
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      placeholder="Search by role or skill (React, Node, etc.)..."
                      className="flex-1 p-2.5 rounded-xl text-slate-800 text-xs focus:outline-none"
                    />
                  </div>
                </div>

                <div className="space-y-4">
                  {filteredJobs.map(job => (
                    <div key={job.id} className="bg-white p-5 rounded-2xl border border-slate-200 hover:shadow-md transition flex justify-between items-center">
                      <div>
                        <h3 className="font-extrabold text-slate-900 text-base">{job.title}</h3>
                        <p className="text-xs text-slate-600 font-medium">{job.company} • 📍 {job.location} • ₹{job.salaryMin}–{job.salaryMax} LPA</p>
                        <div className="flex gap-1.5 mt-2">
                          {job.skills.map(s => (
                            <span key={s} className="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 text-[10px] font-semibold">{s}</span>
                          ))}
                        </div>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => handleToggleSave(job.id)} className="p-2 rounded-xl border border-slate-200 text-xs">
                          {savedJobIds.includes(job.id) ? '❤️' : '🤍'}
                        </button>
                        <button onClick={() => handleApply(job.id)} className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md shadow-indigo-600/30">
                          Apply Now
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {role === 'seeker' && activeTab === 'applications' && (
              <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
                <h2 className="text-xl font-black">Live Application Status Tracker</h2>
                <div className="space-y-3">
                  {applications.map(app => {
                    const job = jobs.find(j => j.id === app.jobId) || { title: "Technical Role", company: "ABC Tech" };
                    return (
                      <div key={app.id} className="p-4 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center">
                        <div>
                          <h4 className="font-bold text-sm text-slate-900">{job.title}</h4>
                          <p className="text-xs text-slate-500">{job.company} • Applied on {app.appliedAt}</p>
                        </div>
                        <span className="px-3 py-1 rounded-full text-xs font-black bg-amber-100 text-amber-800">{app.status}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {role === 'hr' && (
              <div className="bg-white p-6 rounded-2xl border border-slate-200">
                <h2 className="text-xl font-black">💼 Recruiter Candidate Review Board</h2>
                <p className="text-xs text-slate-500 mt-1">Manage applicants and advance status in real time.</p>
                <div className="mt-4 space-y-2">
                  {applications.map(app => (
                    <div key={app.id} className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                      <span className="font-bold">{app.applicantName} ({app.applicantEmail})</span>
                      <span className="font-semibold px-2 py-0.5 rounded bg-purple-100 text-purple-700">{app.status}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {role === 'admin' && (
              <div className="bg-white p-6 rounded-2xl border border-slate-200">
                <h2 className="text-xl font-black">🛡️ Super Admin Moderation Engine</h2>
                <p className="text-xs text-slate-500 mt-1">Platform KPIs & Account Verification.</p>
                <div className="grid grid-cols-3 gap-4 mt-4 text-center">
                  <div className="p-4 bg-slate-50 rounded-xl border"><p className="text-2xl font-black text-indigo-600">{jobs.length}</p><span className="text-xs text-slate-500">Total Jobs</span></div>
                  <div className="p-4 bg-slate-50 rounded-xl border"><p className="text-2xl font-black text-emerald-600">{applications.length}</p><span className="text-xs text-slate-500">Applications</span></div>
                  <div className="p-4 bg-slate-50 rounded-xl border"><p className="text-2xl font-black text-rose-600">6</p><span className="text-xs text-slate-500">Active Accounts</span></div>
                </div>
              </div>
            )}
          </main>

          {/* Floating Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold border border-slate-700 animate-fade-in">
              ✓ {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
